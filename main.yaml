proxy-providers:
  jantit:
    type: "http"
    url: "https://raw.githubusercontent.com/Rusmer/Warp/refs/heads/main/jan2tit.yaml"
    path: "./proxy_providers/jantit.yaml"
    interval: 3600
    size-limit: 0
    health-check:
      enable: false
      url: "http://1.1.1.1"
      interval: 600
      timeout: 5000
      lazy: true
      expected-status: 204
    override:
      udp: true
      mtu: 1280
      persistentkeepalive: 15
  #    dialer-proxy: "Cloudflare WARP"
  proton:
    type: "http"
    url: "https://raw.githubusercontent.com/Rusmer/Warp/refs/heads/main/g3sort.yaml"
    path: "./proxy_providers/proton.yaml"
    interval: 3600
    size-limit: 0
    health-check:
      enable: false
      url: "http://protonvpn.com"
      timeout: 5000
      lazy: true
      expected-status: "*"
    override:
      dialer-proxy: "Cloudflare WARP"
  warp-wg:
    type: "http"
    url: "https://raw.githubusercontent.com/Rusmer/Warp/refs/heads/main/upcWARPc97692.yaml"
    path: "./proxy_providers/warp-wg.yaml"
    interval: 3600
    size-limit: 0
    filter: "^\\[🌍\\]|^\\[⭐\\]|^\\[☁️\\]"
    health-check:
      enable: true
      url: "https://www.gstatic.com/generate_204"
      interval: 600
      timeout: 5000
      lazy: true
      expected-status: 204
    override:
      udp: true
  warp-masque:
    type: "http"
    url: "https://raw.githubusercontent.com/Rusmer/Warp/refs/heads/main/upcWARPc97692.yaml"
    path: "./proxy_providers/warp-masque.yaml"
    interval: 3600
    size-limit: 0
    filter: "^\\[🌍 MQ\\]|^\\[🎭\\] WARP-MASQUE H2"
    health-check:
      enable: true
      url: "https://www.gstatic.com/generate_204"
      interval: 600
      timeout: 5000
      lazy: true
      expected-status: 204
    override:
      dialer-proxy: "Локация"
      udp: true
      network: h2
      proxy-name:
        - pattern: "H2"
          target: "TCP"
      override-expr:
        - ".network = \"h2\""
        - "del(.ipv6)"
  public:
    type: "http"
    url: "https://da.rusmersr.workers.dev/all.yaml"
    path: "./proxy_providers/public.yaml"
    interval: 600
    size-limit: 0
    health-check:
      enable: true
      url: "https://www.gstatic.com/generate_204"
      interval: 600
      timeout: 5000
      lazy: true
      expected-status: 204
    override:
      dialer-proxy: "Локация"
      udp: true
