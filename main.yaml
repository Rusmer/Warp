mixed-port: 7890
allow-lan: false
mode: "rule"
log-level: "info"
ipv6: true
external-controller: "127.0.0.1:9090"
unified-delay: true
tcp-concurrent: true
find-process-mode: "off"
profile:
  store-selected: true
  store-fake-ip: true
sniffer:
  enable: true
  parse-pure-ip: true
  override-destination: false
  sniff:
    HTTP:
      ports:
        - 80
        - "8080-8880"
      override-destination: true
    TLS:
      ports:
        - 443
        - 8443
    QUIC:
      ports:
        - 443
        - 8443
dns:
  enable: true
  ipv6: false
  listen: "0.0.0.0:1053"
  enhanced-mode: "fake-ip"
  fake-ip-range: "198.18.0.1/16"
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "localhost.ptlogin2.qq.com"
  default-nameserver:
    - "1.1.1.1"
    - "8.8.8.8"
    - "77.88.8.8"
  nameserver:
    - "https://dns.google/dns-query"
    - "https://cloudflare-dns.com/dns-query"
    - "tls://dns.google"
  proxy-server-nameserver:
    - "1.1.1.1"
    - "8.8.8.8"
  nameserver-policy:
    +.ru:
      - "77.88.8.8"
      - "77.88.8.1"
tun:
  enable: true
  stack: "mixed"
  dns-hijack:
    - "any:53"
  auto-route: true
  auto-detect-interface: true
  strict-route: false
  mtu: 1500
